name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test before release
        run: go test ./...
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build artifacts
        run: bash scripts/build-dist.sh "${{ steps.version.outputs.value }}"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  # Run each platform's actual release artifact on its native runner, so a
  # release can only publish if the binary really executes on macOS, Linux,
  # and Windows.
  verify:
    name: Verify ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-amd64.tar.gz
            bin: cockpit
          - os: macos-latest
            asset: darwin-arm64.tar.gz
            bin: cockpit
          - os: windows-latest
            asset: windows-amd64.zip
            bin: cockpit.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Extract and run the artifact
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.build.outputs.version }}"
          asset="cockpit-${tag}-${{ matrix.asset }}"
          dir="${asset%.tar.gz}"
          dir="${dir%.zip}"
          cd dist
          case "$asset" in
            *.zip)
              # git-bash tar on Windows is GNU tar (no zip support); fall back.
              if command -v unzip >/dev/null; then unzip -q -o "$asset"
              elif command -v 7z >/dev/null; then 7z x -y "$asset" >/dev/null
              else powershell -NoProfile -Command "Expand-Archive -Force '$asset' '.'"
              fi ;;
            *) tar -xzf "$asset" ;;
          esac
          bin="$dir/${{ matrix.bin }}"
          echo "running $bin on ${{ matrix.os }}"
          out="$("$bin" --version)"
          echo "$out"
          echo "$out" | grep -q "cockpit version ${tag}"
          # Exercise a non-TUI code path end to end.
          "$bin" today --json > /dev/null
          "$bin" doctor > /dev/null

  publish:
    name: Publish release
    needs: [build, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Generate release notes
        run: python3 scripts/release-notes.py "${{ needs.build.outputs.version }}" > release-notes.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: agent-cockpit ${{ needs.build.outputs.version }}
          files: dist/*
          body_path: release-notes.md
