name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go build ./cmd/cockpit

  race:
    name: Race + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  benchmark:
    name: Benchmarks
    needs: [test]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run benchmarks
        run: |
          set -o pipefail
          make bench | tee benchmark.txt
      - uses: actions/upload-artifact@v7
        with:
          name: benchmarks
          path: benchmark.txt

  cli-smoke:
    name: CLI Smoke
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -o cockpit ./cmd/cockpit
      - name: Smoke script-facing commands
        run: |
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/empty"
          cat > "$tmp/config.toml" <<EOF
          timezone = "UTC"
          refresh_interval = "3s"
          currency = "USD"

          [paths]
          claude = ["$tmp/empty"]
          codex = ["$tmp/empty"]
          gemini = ["$tmp/empty"]
          opencode = ["$tmp/empty"]
          amp = ["$tmp/empty"]
          copilot = ["$tmp/empty"]
          kimi = ["$tmp/empty"]
          qwen = ["$tmp/empty"]
          codebuff = ["$tmp/empty"]
          kilo = ["$tmp/empty"]
          goose = ["$tmp/empty"]
          EOF

          ./cockpit config schema > "$tmp/schema.json"
          python3 -m json.tool "$tmp/schema.json" >/dev/null

          ./cockpit --config "$tmp/config.toml" config validate
          ./cockpit --config "$tmp/config.toml" --json config validate > "$tmp/config-validate.json"
          python3 -m json.tool "$tmp/config-validate.json" >/dev/null

          ./cockpit --config "$tmp/config.toml" --json pricing status > "$tmp/pricing-status.json"
          python3 -m json.tool "$tmp/pricing-status.json" >/dev/null

          ./cockpit --config "$tmp/config.toml" --json statusline > "$tmp/statusline.json"
          python3 -m json.tool "$tmp/statusline.json" >/dev/null

          ./cockpit --config "$tmp/config.toml" export --group daily > "$tmp/daily.csv"
          test -s "$tmp/daily.csv"
          python3 scripts/release-notes.py --check HEAD

  cross-compile:
    name: Cross Compile
    needs: [lint, test, cli-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: bash scripts/build-dist.sh snapshot
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
