name: Pricing Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write

concurrency:
  group: pricing-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh vendored pricing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check upstream pricing
        id: check
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/cockpit pricing update --check --json > pricing-check.json

          up_to_date="$(python3 - <<'PY'
          import json

          with open("pricing-check.json") as f:
              check = json.load(f)
          print(str(check["up_to_date"]).lower())
          PY
          )"
          echo "up_to_date=${up_to_date}" >> "$GITHUB_OUTPUT"

          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json

          with open("pricing-check.json") as f:
              check = json.load(f)

          print("## Pricing refresh")
          print()
          print(f"- Source: {check['source_url']}")
          print(f"- Current models: {check['current']['model_count']}")
          print(f"- Latest models: {check['latest_models']}")
          print(
              "- Diff: "
              f"+{check['added_models']} / "
              f"-{check['removed_models']} / "
              f"~{check['changed_models']} models"
          )
          print(f"- Latest SHA256: `{check['latest_sha256']}`")
          PY

      - name: Refresh snapshot
        if: steps.check.outputs.up_to_date == 'false'
        run: make pricing

      - name: Test refreshed snapshot
        if: steps.check.outputs.up_to_date == 'false'
        run: make ci

      # GitHub Actions PR creation is disabled for this repository. Commit the
      # generated-only snapshot after the full CI gate instead. A concurrent
      # update to the branch makes this fast-forward push fail safely.
      - name: Commit refreshed snapshot
        if: steps.check.outputs.up_to_date == 'false'
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- internal/usage/pricing_data.json internal/usage/pricing_metadata.json; then
            echo "No pricing file changes after refresh."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/usage/pricing_data.json internal/usage/pricing_metadata.json
          git commit -m "pricing: refresh vendored snapshot"
          git push origin "HEAD:$GITHUB_REF_NAME"
